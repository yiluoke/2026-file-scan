# ソース解析専用。現在のfile-scan設定とは別ファイル。
schema_version: cpp-scan-v1
project_id: qt5-sample
source_root: examples/qt5-source
artifact_root: artifacts/cpp-scan/qt5-sample
source_encoding: auto
fallback_encoding: cp932
encoding_overrides: {}
ui_mode: auto
pro_mode: reference_only
include_tests: false
include_third_party: false
include_files: []
exclude_patterns: []
max_file_bytes: 10485760
max_files: 50000
copy_retries: 2
allow_partial_ingest: false
codewiki:
  # cpp-scanを実行しているPython 3.14を使う。
  expected_version: 2.0.0
  expected_commit: 1b4af43d6d20c8dbd758fe1d5f888cc6947ed11d
  timeout_seconds: 3600
  max_tokens: 8192
  request_limit: 30
  max_depth: 2
documentation:
  language: ja
  provider: codewiki
  model_env: CPP_SCAN_LLM_MODEL
  api_key_env: CPP_SCAN_LLM_API_KEY
  base_url_env: CPP_SCAN_LLM_BASE_URL
ingestion:
  file_scan_config: config.cpp-docs.local.yaml
