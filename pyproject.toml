[build-system]
requires = ["setuptools==78.1.1"]
build-backend = "setuptools.build_meta"

[project]
name = "file-scan"
version = "0.1.0"
description = "ファイルサーバーの文書を収集・変換し、DBへ下書き登録するCLI"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "SQLAlchemy==2.0.45",
    "psycopg[binary]==3.3.2",
    "PyYAML==6.0.3",
    "openpyxl==3.1.5",
    "python-docx==1.2.0",
    "pypdf==6.9.2",
    "charset-normalizer==3.4.4",
    "Pillow==12.1.1",
    "openai==2.21.0",
    "pgvector==0.5.1",
    "tiktoken==0.12.0",
    "docling-slim[convert-core,extract-core,format-pdf,models-local]==2.140.0",
    "opencv-python==4.10.0.84",
    "rapidocr==3.9.1",
    "onnxruntime==1.24.1",
]

[project.optional-dependencies]
search = ["fastapi==0.118.0", "starlette==0.48.0", "uvicorn==0.38.0", "httpx==0.28.1", "greenlet==3.3.2"]
dev = ["pytest==9.0.2", "ruff==0.17.1", "reportlab==4.4.10", "httpx==0.28.1"]

[project.scripts]
file-scan = "file_scan.cli:main"
file-search = "search.cli:main"
cpp-scan = "cpp_scan.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
file_scan = ["docling-models.lock.json", "rapidocr-models.lock.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
