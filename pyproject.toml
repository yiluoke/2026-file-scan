[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "file-scan"
version = "0.1.0"
description = "ファイルサーバーの文書を収集・変換し、DBへ下書き登録するCLI"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "SQLAlchemy==2.1.5",
    "psycopg[binary]==3.3.6",
    "PyYAML==6.0.3",
    "openpyxl==3.1.5",
    "python-docx==1.2.0",
    "pypdf==6.10.0",
    "charset-normalizer==3.5.2",
    "Pillow==12.3.0",
]

[project.optional-dependencies]
docling = ["docling==2.140.0"]
dev = ["pytest==9.1.1", "ruff==0.17.1", "reportlab==4.4.9"]

[project.scripts]
file-scan = "file_scan.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
